# CreditTrace local stack: PostgreSQL + Anvil (dev EVM) + the API.
# `docker compose up --build` trains a model, deploys the registry to Anvil,
# and serves the API on http://localhost:8000 (docs at /docs).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: credittrace
      POSTGRES_PASSWORD: credittrace
      POSTGRES_DB: credittrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credittrace"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      anvil:
        condition: service_started
    environment:
      CT_ENVIRONMENT: docker
      CT_DATABASE_URL: postgresql+psycopg://credittrace:credittrace@db:5432/credittrace
      CT_CHAIN_ENABLED: "true"
      CT_CHAIN_RPC_URL: http://anvil:8545
      # Anvil's first well-known dev key. Development only; never use on a public chain.
      CT_CHAIN_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    ports:
      - "8000:8000"

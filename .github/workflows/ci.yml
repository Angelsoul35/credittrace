name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, compile & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package
        run: pip install -e ".[dev]"

      - name: Compile the contract
        run: |
          cd contracts
          npm ci
          node compile.js

      - name: Fail if the committed artifact is stale
        run: git diff --exit-code contracts/artifacts/DecisionRegistry.json

      - name: Lint
        run: ruff check app tests scripts

      - name: Test with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  foundry:
    name: Contract tests (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std --no-commit || forge install foundry-rs/forge-std

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bandit (Python SAST)
        run: |
          pip install bandit
          bandit -r app -ll

  docker:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile -t credittrace:ci .
